apiVersion: apps/v1
kind: Deployment
metadata:
  name: commodity-api
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: commodity-api
  template:
    metadata:
      labels:
        app: commodity-api
    spec:
      containers:
        - name: api
          image: ghcr.io/OWNER/REPO/commodity-api:ci
          ports:
            - containerPort: 8080