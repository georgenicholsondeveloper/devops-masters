apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: commodity-api
  namespace: dev
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: commodity-api
                port:
                  number: 80
    - host: commodity-api.dev.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: commodity-api
                port:
                  number: 80