name: Continous Integration | Push to branch
description: Builds and runs Unit tests with dotnet. Builds and runs Integration Tests against docker.

on:
  push:
    branches-ignore: [ main ]

permissions:
  contents: read
  checks: write
  actions: write  
  security-events: write


jobs:
  build-and-run-unit-tests:
    name: Build and run Unit Tests
    runs-on: [ubuntu-latest]
    steps:

      - name: Checkout
        uses: actions/checkout@v5

      - name: Install nuget
        uses: nuget/setup-nuget@v3
        with:
          nuget-version: latest
          
      - name: Set up .NET
        uses: actions/setup-dotnet@v5

      - name: Restore dependencies
        working-directory: src
        run: dotnet restore
        
      - name: Run Unit Tests
        working-directory: src/tests
        run: |
          dotnet test Commodity.Api.UnitTests -c Release

  build-image:
    name: Build Docker Image
    runs-on: [ubuntu-latest]
    needs: build-and-run-unit-tests
    steps:

      - name: Checkout
        uses: actions/checkout@v5
 
      - name: Build Docker Image
        working-directory: src/Commodity.Api
        run: |
          docker build -t ghcr.io/${{github.repository}}/commodity-api:${{github.SHA}} .

  integration-tests:
    name: Run Integration Tests against Docker Container
    runs-on: [ubuntu-latest]
    needs: 
      - build-image
    env:
      BaseUrl: http://localhost:8080
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run docker container
        working-directory: src       
        env:
            GITHUB_REPOSITORY: ${{ github.repository }}
            GITHUB_SHA: ${{ github.sha }}
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d
      
      - name: Show whether api has build context
        working-directory: src
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml config
      
      - name: Wait for API container health
        working-directory: src
        run: |
          for i in {1..30}; do
            if docker compose ps --status=running --status=healthy | grep api; then
              echo "API is healthy"
              exit 0
            fi
            sleep 2
          done

          echo "API did not become healthy"
          docker compose ps
          exit 1

      - name: Run Integration Tests
        working-directory: src/tests
        run: dotnet test Commodity.Api.IntegrationTests -c Release