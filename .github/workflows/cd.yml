name: Continuous Deployment
description: Deploys the application through DEV, UAT and PROD.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  checks: write
  actions: write  
  security-events: write

jobs:
  build-test-and-push-image:
    name: Build, Test and Push Docker Image
    runs-on: [ubuntu-latest]
    env:
      BaseUrl: http://localhost:8080
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install nuget
        uses: nuget/setup-nuget@v3
        with:
          nuget-version: latest
          
      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        working-directory: src
        run: dotnet restore
        
      - name: Run Unit Tests
        working-directory: src/tests
        run: |
          dotnet test Commodity.Api.UnitTests -c Release --no-restore

      - name: Build Docker Image
        working-directory: src/Commodity.Api
        run: |
          docker build -t ghcr.io/${{github.repository}}/commodity-api:${{github.SHA}} .

      - name: Scan Image
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: 'ghcr.io/${{github.repository}}/commodity-api:${{github.SHA}}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          version: v0.69.3

      - name: Run Docker Container
        working-directory: src       
        env:
            GITHUB_REPOSITORY: ${{ github.repository }}
            GITHUB_SHA: ${{ github.sha }}
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d
      
      - name: Wait for API to be healthy
        working-directory: src
        run: |
          for i in {1..30}; do
            if docker compose ps --status=running --status=healthy | grep api; then
              echo "API is healthy"
              exit 0
            fi
            sleep 2
          done

          echo "API did not become healthy"
          docker compose ps
          exit 1

      - name: Run Integration Tests
        working-directory: src/tests
        run: dotnet test Commodity.Api.IntegrationTests -c Release

      - name: Install k6
        run: sudo snap install k6

      - name: Run Performance Smoke Tests
        working-directory: src/tests/Commodity.Api.PerformanceTests
        run: k6 run performance-smoke-tests.js

      - name: Post Compose logs on failure
        if: failure()
        working-directory: src
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --no-color
      
      - name: Tear down Compose
        if: always()
        working-directory: src
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v

      - name: Push Docker Image
        working-directory: src/Commodity.Api
        run: |
          docker push ghcr.io/${{ github.repository }}/commodity-api:${{ github.SHA }}

  deploy-to-dev:
    runs-on: ubuntu-latest
    environment: dev   
    needs: build-test-and-push-image
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}/commodity-api
      IMAGE_TAG: ${{ github.SHA }}
      KUBE_CONFIG: ${{ secrets.KUBECONFIG_BASE64 }}
      DB_CONNECTION_STRING: ${{ secrets.DATABASE_CONNECTION_STRING }}
      ENVIRONMENT: 'dev'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Set kubeconfig
        shell: bash
        run: |
          echo "${{ secrets.KUBECONFIG_BASE64 }}" | base64 -d > kubeconfig.yml
          echo "KUBECONFIG=$PWD/kubeconfig.yml" >> $GITHUB_ENV

      - name: Verify cluster access
        run: |
          kubectl get ns
          kubectl get nodes

      - name: Apply secrets
        run: |
          kubectl -n ${{ env.ENVIRONMENT }} create secret generic commodity-db \
            --from-literal=ConnectionStrings__DefaultConnection="$DB_CONNECTION_STRING" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply base manifests
        run: |
          kubectl apply -f k8s/${{ env.ENVIRONMENT }}/service.yml
          kubectl apply -f k8s/${{ env.ENVIRONMENT }}/deployment.yml
          kubectl apply -f k8s/${{ env.ENVIRONMENT }}/ingress.yml

      - name: Update image to the new commit SHA
        run: |
          kubectl -n ${{ env.ENVIRONMENT }} set image deployment/commodity-api api=ghcr.io/${{ github.repository }}/commodity-api:${{ env.IMAGE_TAG }}
          kubectl -n ${{ env.ENVIRONMENT }} rollout status deployment/commodity-api --timeout=180s

  dev-smoke-tests:
    runs-on: [ubuntu-latest]
    needs: deploy-to-dev
    env:
      BaseUrl: "http://20.74.10.95"
      ApiHostName: "commodity-api.dev.com"
      Environment: 'Dev'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run Functional Smoke Tests
        working-directory: src/tests
        run: dotnet test Commodity.Api.SmokeTests -c Release

  acceptance-tests:
    runs-on: [ubuntu-latest]
    needs: dev-smoke-tests
    env:
      BaseUrl: "http://20.74.10.95"
      ApiHostName: "commodity-api.dev.com"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        
      - name: Run Acceptance Tests
        working-directory: src/tests
        run: dotnet test Commodity.Api.AcceptanceTests -c Release

  performance-tests:
    runs-on: [ubuntu-latest]
    needs: acceptance-tests
    env:
      BaseUrl: "http://20.74.10.95"
      ApiHostName: "commodity-api.dev.com"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install k6
        run: sudo snap install k6

      - name: Run Performance Tests
        working-directory: src/tests/Commodity.Api.PerformanceTests
        run: k6 run performance-tests.js

  deploy-to-uat:
    runs-on: ubuntu-latest
    needs: performance-tests
    environment: uat   
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}/commodity-api
      IMAGE_TAG: ${{ github.SHA }}
      KUBE_CONFIG: ${{ secrets.KUBECONFIG_BASE64 }}
      DB_CONNECTION_STRING: ${{ secrets.DATABASE_CONNECTION_STRING }}
      ENVIRONMENT: 'uat'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Set kubeconfig
        shell: bash
        run: |
          echo "${{ secrets.KUBECONFIG_BASE64 }}" | base64 -d > kubeconfig.yml
          echo "KUBECONFIG=$PWD/kubeconfig.yml" >> $GITHUB_ENV

      - name: Verify cluster access
        run: |
          kubectl get ns
          kubectl get nodes

      - name: Apply secrets
        run: |
          kubectl -n ${{ env.ENVIRONMENT }} create secret generic commodity-db \
            --from-literal=ConnectionStrings__DefaultConnection="$DB_CONNECTION_STRING" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply base manifests
        run: |
          kubectl apply -f k8s/${{ env.ENVIRONMENT }}/service.yml
          kubectl apply -f k8s/${{ env.ENVIRONMENT }}/deployment.yml
          kubectl apply -f k8s/${{ env.ENVIRONMENT }}/ingress.yml

      - name: Update image to the new commit SHA
        run: |
          kubectl -n ${{ env.ENVIRONMENT }} set image deployment/commodity-api api=ghcr.io/${{ github.repository }}/commodity-api:${{ env.IMAGE_TAG }}
          kubectl -n ${{ env.ENVIRONMENT }} rollout status deployment/commodity-api --timeout=180s

  uat-smoke-tests:
    runs-on: [ubuntu-latest]
    needs: deploy-to-uat
    env:
      BaseUrl: "http://20.74.10.95"
      ApiHostName: "commodity-api.uat.com"
      Environment: 'UAT'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run Functional Smoke Tests
        working-directory: src/tests
        run: dotnet test Commodity.Api.SmokeTests -c Release

  deploy-to-prod:
    runs-on: ubuntu-latest
    needs: uat-smoke-tests
    environment: prod   
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}/commodity-api
      IMAGE_TAG: ${{ github.SHA }}
      KUBE_CONFIG: ${{ secrets.KUBECONFIG_BASE64 }}
      DB_CONNECTION_STRING: ${{ secrets.DATABASE_CONNECTION_STRING }}
      ENVIRONMENT: 'prod'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Set kubeconfig
        shell: bash
        run: |
          echo "${{ secrets.KUBECONFIG_BASE64 }}" | base64 -d > kubeconfig.yml
          echo "KUBECONFIG=$PWD/kubeconfig.yml" >> $GITHUB_ENV

      - name: Verify cluster access
        run: |
          kubectl get ns
          kubectl get nodes

      - name: Apply secrets
        run: |
          kubectl -n ${{ env.ENVIRONMENT }} create secret generic commodity-db \
            --from-literal=ConnectionStrings__DefaultConnection="$DB_CONNECTION_STRING" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply base manifests
        run: |
          kubectl apply -f k8s/${{ env.ENVIRONMENT }}/service.yml
          kubectl apply -f k8s/${{ env.ENVIRONMENT }}/deployment.yml
          kubectl apply -f k8s/${{ env.ENVIRONMENT }}/ingress.yml

      - name: Update image to the new commit SHA
        run: |
          kubectl -n ${{ env.ENVIRONMENT }} set image deployment/commodity-api api=ghcr.io/${{ github.repository }}/commodity-api:${{ env.IMAGE_TAG }}
          kubectl -n ${{ env.ENVIRONMENT }} rollout status deployment/commodity-api --timeout=180s

  prod-smoke-tests:
    runs-on: [ubuntu-latest]
    needs: deploy-to-prod
    env:
      BaseUrl: "http://20.74.10.95"
      ApiHostName: "commodity-api.prod.com"
      Environment: 'Prod'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run Functional Smoke Tests
        working-directory: src/tests
        run: dotnet test Commodity.Api.SmokeTests -c Release
