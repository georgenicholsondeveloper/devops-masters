name: Build and Test dotnet application
description: Builds and tests the application using dotnet

on:
  push:
    branches:
      - [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  checks: write
  actions: write  
  security-events: write


jobs:
  build-and-run-unit-tests:
    runs-on: [ubuntu-latest]
    steps:

      - name: Checkout
        uses: actions/checkout@v5

      - name: Install nuget
        uses: nuget/setup-nuget@v2
        with:
          nuget-version: latest
          
      - name: Set up .NET
        uses: actions/setup-dotnet@v5

      - name: Restore dependencies
        working-directory: src/CommodityArticle.Api
        run: dotnet restore
        
      - name: Run Unit Tests
        working-directory: src/tests
        run: |
          dotnet test CommodityArticle.Api.UnitTests -c Release

  build-image:
    runs-on: [ubuntu-latest]
    needs: build-and-run-unit-tests
    steps:

      - name: Checkout
        uses: actions/checkout@v5
        
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
 
      - name: Build and push Docker image
        working-directory: src/CommodityArticle.Api
        run: |
          docker build -t ghcr.io/${{github.repository}}/myapp:ci .
          docker push ghcr.io/${{ github.repository }}/myapp:ci

  integration-tests:
    runs-on: [ubuntu-latest]
    needs: 
      - build-image
      - analyze
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull docker image
        run: docker pull ghcr.io/${{ github.repository }}/myapp:ci

      - name: Run docker container
        working-directory: src/CommodityArticle.Api
        run: docker run -d --name myapp -p 8080:8080 ghcr.io/${{ github.repository }}/myapp:ci

      - name: Run Integration Tests
        working-directory: src/tests
        run: dotnet test CommodityArticle.Api.IntegrationTests -c Release

  analyze:
    name: SAST (CodeQL)
    runs-on: [ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        
      - name: CodeQL Init
        uses: github/codeql-action/init@v4
        with:
          languages: "csharp"

      - name: Build
        working-directory: src
        run: |
          dotnet build CommodityArticle.Api/CommodityArticle.Api.csproj --configuration Release
          dotnet build tests/CommodityArticle.Api.UnitTests/CommodityArticle.Api.UnitTests.csproj --configuration Release
          dotnet build tests/CommodityArticle.Api.IntegrationTests/CommodityArticle.Api.IntegrationTests.csproj --configuration Release


      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:csharp"


      
