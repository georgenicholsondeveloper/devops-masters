name: Build and Test dotnet application
description: Builds and tests the application using dotnet

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  checks: write
  actions: write  
  security-events: write


jobs:
  build-and-run-unit-tests:
    runs-on: [ubuntu-latest]
    steps:

      - name: Checkout
        uses: actions/checkout@v5

      - name: Install nuget
        uses: nuget/setup-nuget@v3
        with:
          nuget-version: latest
          
      - name: Set up .NET
        uses: actions/setup-dotnet@v5

      - name: Restore dependencies
        working-directory: src
        run: dotnet restore
        
      - name: Run Unit Tests
        working-directory: src/tests
        run: |
          dotnet test Commodity.Api.UnitTests -c Release

  build-image:
    runs-on: [ubuntu-latest]
    needs: build-and-run-unit-tests
    steps:

      - name: Checkout
        uses: actions/checkout@v5
        
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
 
      - name: Build Docker image
        working-directory: src/Commodity.Api
        run: |
          docker build -t ghcr.io/${{github.repository}}/commodity-api:${{github.SHA}} .

      - name: Scan Image
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: 'ghcr.io/${{github.repository}}/commodity-api:${{github.SHA}}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          version: v0.69.3
         
      - name: Push Docker Image
        working-directory: src/Commodity.Api
        run: |
          docker push ghcr.io/${{ github.repository }}/commodity-api:${{ github.SHA }}

  integration-tests:
    runs-on: [ubuntu-latest]
    needs: 
      - build-image
      - analyze
    env:
      BaseUrl: http://localhost:8080
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull docker image
        run: docker pull ghcr.io/${{ github.repository }}/commodity-api:${{github.SHA}}

      - name: Run docker container
        working-directory: src     
        env:
            GITHUB_REPOSITORY: ${{ github.repository }}
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build

      - name: Wait for API to be healthy
        run: |
          for i in {1..30}; do
            if curl -fs http://localhost:8080/; then
              echo "API ready"
              exit 0
            fi
            sleep 2
          done
          echo "API not ready in time"
          exit 1

      - name: Run Functional Smoke Tests
        working-directory: src/tests
        run: dotnet test Commodity.Api.SmokeTests -c Release

      - name: Run Integration Tests
        working-directory: src/tests
        run: dotnet test Commodity.Api.IntegrationTests -c Release

      - name: Install k6
        run: sudo snap install k6

      - name: Run Performance Smoke Tests
        working-directory: src/tests/Commodity.Api.PerformanceTests
        run: k6 run performance-smoke-tests.js

  analyze:
     name: SAST (CodeQL)
     runs-on: [ubuntu-latest]

     steps:
       - name: Checkout
         uses: actions/checkout@v5
        
       - name: CodeQL Init
         uses: github/codeql-action/init@v4
         with:
           languages: "csharp"
           build-mode: manual

       - name: Build
         working-directory: src
         run: |
           dotnet build Commodity.Api/Commodity.Api.csproj --configuration Release
           dotnet build tests/Commodity.Api.UnitTests/Commodity.Api.UnitTests.csproj --configuration Release
           dotnet build tests/Commodity.Api.IntegrationTests/Commodity.Api.IntegrationTests.csproj --configuration Release


       - name: Analyze
         uses: github/codeql-action/analyze@v4
         with:
           category: "/language:csharp"


      
