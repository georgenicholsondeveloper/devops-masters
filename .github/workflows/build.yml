name: Build and Test dotnet application
description: Builds and tests the application using dotnet

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  checks: write
  actions: write  

jobs:
  build:
    runs-on: [ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install nuget
        uses: nuget/setup-nuget@v1
        with:
          nuget-version: latest

      - name: Set up .NET
        uses: actions/setup-dotnet@v1

      - name: Restore dependencies
        working-directory: src/CommodityArticle.Api
        run: dotnet restore

      - name: Build with dotnet
        working-directory: src/CommodityArticle.Api
        run: dotnet build --configuration Release

  test:
    runs-on: [ubuntu-latest]
    needs: build
    steps:

      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Run tests
        working-directory: src/tests/CommodityArticle.Api.UnitTests
        run: |
          dotnet test CommodityArticle.Api.UnitTests.csproj

  build-image:
    runs-on: [ubuntu-latest]
    needs: test
    steps:

      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
 
      - name: Build and push image
        working-directory: src/CommodityArticle.Api
        run: |
          docker build -t ghcr.io/${{github.repository}}/myapp:ci .
          docker push ghcr.io/${{ github.repository }}/myapp:ci

  integration-tests:
    runs-on: [ubuntu-latest]
    needs: build-image
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image
        run: docker pull ghcr.io/${{ github.repository }}/myapp:ci

      - name: Run container
        working-directory: src/CommodityArticle.Api
        run: docker run -d --name myapp -p 8080:8080 ghcr.io/${{ github.repository }}/myapp:ci

      - name: Integration Tests
        working-directory: src/tests
        run: dotnet test CommodityArticle.Api.IntegrationTests
      
