name: Build
description: Builds the application using docker

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  checks: write
  actions: write  

jobs:
  build:
    runs-on: [ubuntu-latest]

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        working-directory: src/CommodityArticle.Api
        run: |
          docker build -t myapp:ci .
