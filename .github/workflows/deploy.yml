name: Deploy the application
description: Deploys the application

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  checks: write
  actions: write  
  security-events: write


jobs:
  smoke-tests:
    runs-on: [ubuntu-latest]
    env:
      BaseUrl: "https://super-lamp-7pvq76p5rj7fpx7x-8080.app.github.dev"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run Functional Smoke Tests
        working-directory: src/tests
        run: dotnet test Commodity.Api.SmokeTests -c Release

  acceptance-tests:
    runs-on: [ubuntu-latest]
    needs: smoke-tests
    env:
      BaseUrl: "https://super-lamp-7pvq76p5rj7fpx7x-8080.app.github.dev"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        
      - name: Run Acceptance Tests
        working-directory: src/tests
        run: dotnet test Commodity.Api.AcceptanceTests -c Release

  performance-tests:
    runs-on: [ubuntu-latest]
    needs: acceptance-tests
    env:
      BaseUrl: "https://super-lamp-7pvq76p5rj7fpx7x-8080.app.github.dev"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install k6
        run: sudo snap install k6

      - name: Run Performance Tests
        working-directory: src/tests/Commodity.Api.PerformanceTests
        run: k6 run performance-tests.js
