name: Deploy the application
description: Deploys the application

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  checks: write
  actions: write  
  security-events: write


jobs:
  deploy_dev:
    needs: build_scan_push
    runs-on: ubuntu-latest
    environment: dev   
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}/commodity-api
    steps:
      - name: Checkout (manifests)
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Set kubeconfig (from secret)
        shell: bash
        run: |
          echo "${{ secrets.KUBECONFIG_BASE64 }}" | base64 -d > kubeconfig.yaml
          echo "KUBECONFIG=$PWD/kubeconfig.yaml" >> $GITHUB_ENV

      - name: Verify cluster access
        run: |
          kubectl get ns
          kubectl get nodes

      - name: Apply base manifests (idempotent)
        run: |
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/deployment.yaml

      - name: Update image to the new commit SHA
        run: |
          kubectl -n dev set image deployment/commodity-api api=ghcr.io/${{ github.repository }}/commodity-api:${{ github.sha }}
          kubectl -n dev rollout status deployment/commodity-api


  smoke-tests:
    runs-on: [ubuntu-latest]
    env:
      BaseUrl: "https://super-lamp-7pvq76p5rj7fpx7x-8080.app.github.dev"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run Functional Smoke Tests
        working-directory: src/tests
        run: dotnet test Commodity.Api.SmokeTests -c Release

  acceptance-tests:
    runs-on: [ubuntu-latest]
    needs: smoke-tests
    env:
      BaseUrl: "https://super-lamp-7pvq76p5rj7fpx7x-8080.app.github.dev"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        
      - name: Run Acceptance Tests
        working-directory: src/tests
        run: dotnet test Commodity.Api.AcceptanceTests -c Release

  performance-tests:
    runs-on: [ubuntu-latest]
    needs: acceptance-tests
    env:
      BaseUrl: "https://super-lamp-7pvq76p5rj7fpx7x-8080.app.github.dev"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install k6
        run: sudo snap install k6

      - name: Run Performance Tests
        working-directory: src/tests/Commodity.Api.PerformanceTests
        run: k6 run performance-tests.js
