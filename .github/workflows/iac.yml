name: Manage Infrastructure
description: Plan and Apply Terraform on approval

on:
  push:
    branches: [ main ]
    paths:
      - 'terraform/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan-terraform:
    name: Plan Terraform
    runs-on: [ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Plan Terraform
        run: echo "Terraform plan would execute here."

  apply-terraform:
    name: Apply Terraform
    runs-on: [ubuntu-latest]
    needs: plan-terraform
    environment: requires-approval
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Apply Terraform
        run: echo "Terraform apply would execute here."
