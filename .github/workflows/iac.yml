name: Deploy Infrastructure via Terraform
description: Plans and Deploys the Terraform

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  checks: write
  actions: write  
  security-events: write

jobs:
  plan-terraform:
    runs-on: [ubuntu-latest]
    steps:

      - name: Checkout
        uses: actions/checkout@v5

      - name: Plan Terraform
        uses: ./.github/actions/terraform-plan
        with:
          environment: 'dev'
          plan_type: 'pull_request'
          major_version_number: 1
          local_run_number: ${{github.run_number}}
