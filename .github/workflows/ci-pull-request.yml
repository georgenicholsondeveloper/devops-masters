name: Continuous Integration
description: Build & Test with dotnet. Build and Test Docker. Trivy scan + k6 performance tests.

on:
  push:
    branches-ignore: [ main ]
    paths-ignore:
      - 'terraform/**'
      - '.github/**'
  pull_request:
    types: [ opened, synchronize, reopened ]
    paths-ignore:
      - 'terraform/**'
      - '.github/**'

permissions:
  contents: read
  checks: write
  actions: write  

jobs:
  ci:
    uses: ./.github/workflows/ci-base.yml
    with:
      run_trivy: true
      run_k6: true