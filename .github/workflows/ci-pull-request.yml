name: Continuous Integration | Pull Request
description: Runs the Comprehensive CI Suite | Build & Test, SAST, Docker Compose and Push Image

on:
  pull_request:
    types: [ opened, synchronize, reopened ]

permissions:
  contents: read
  packages: write
  checks: write
  actions: write  
  security-events: write

jobs:
  ci:
    name: Build Application and Run Tests
    runs-on: [ubuntu-latest]
    env:
      BaseUrl: http://localhost:8080
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install nuget
        uses: nuget/setup-nuget@v3
        with:
          nuget-version: latest
          
      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        working-directory: src
        run: dotnet restore
        
      - name: Run Unit Tests
        working-directory: src/tests
        run: |
          dotnet test Commodity.Api.UnitTests -c Release --no-restore

      - name: Build Docker Image
        working-directory: src/Commodity.Api
        run: |
          docker build -t ghcr.io/${{github.repository}}/commodity-api:${{github.SHA}} .

      - name: Scan Image
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: 'ghcr.io/${{github.repository}}/commodity-api:${{github.SHA}}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          version: v0.69.3

      - name: Run Docker Container
        working-directory: src       
        env:
            GITHUB_REPOSITORY: ${{ github.repository }}
            GITHUB_SHA: ${{ github.sha }}
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d
      
      - name: Wait for API to be healthy
        working-directory: src
        run: |
          for i in {1..30}; do
            if docker compose ps --status=running --status=healthy | grep api; then
              echo "API is healthy"
              exit 0
            fi
            sleep 2
          done

          echo "API did not become healthy"
          docker compose ps
          exit 1

      - name: Run Integration Tests
        working-directory: src/tests
        run: dotnet test Commodity.Api.IntegrationTests -c Release

      - name: Install k6
        run: sudo snap install k6

      - name: Run Performance Smoke Tests
        working-directory: src/tests/Commodity.Api.PerformanceTests
        run: k6 run performance-smoke-tests.js

      - name: Post Compose logs on failure
        if: failure()
        working-directory: src
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --no-color
      
      - name: Tear down Compose
        if: always()
        working-directory: src
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v

  sast-sonar:
    name: SAST (Sonar Qube)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install SonarScanner for .NET
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Begin Sonar analysis
        working-directory: src
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet sonarscanner begin \
            /k:"georgenicholsondeveloper_devops-masters" \
            /o:"georgenicholsondeveloper" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.token="${SONAR_TOKEN}" \
            /d:sonar.cs.opencover.reportsPaths="**/TestResults/**/coverage.opencover.xml" \
            /d:sonar.cs.vstest.reportsPaths="**/TestResults/*.trx"

      - name: Build
        working-directory: src
        run: dotnet build -c Release

      - name: Test (with coverage)
        working-directory: src
        run: dotnet test tests/Commodity.Api.UnitTests -c Release --collect:"XPlat Code Coverage;Format=opencover" --logger "trx"

      - name: End Sonar analysis
        working-directory: src
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="${SONAR_TOKEN}"

  sast-codeql:
     name: SAST (CodeQL)
     runs-on: [ubuntu-latest]
     steps:
       - name: Checkout
         uses: actions/checkout@v5
        
       - name: CodeQL Init
         uses: github/codeql-action/init@v4
         with:
           languages: "csharp"
           build-mode: manual

       - name: Build
         working-directory: src
         run: dotnet build commodity-api.sln -c Release

       - name: Analyze
         uses: github/codeql-action/analyze@v4
         with:
           category: "/language:csharp"
